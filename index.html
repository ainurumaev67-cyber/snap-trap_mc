<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Trap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="banner">
    <div class="banner-half banner-left">
      <img src="icon.png" alt="Snap Trap icon" class="banner-icon">
      <h1 class="banner-title">
        <span class="title-snap">Snap</span>
        <span class="title-trap">Trap</span>
      </h1>
    </div>
    <div class="banner-half banner-right"></div>
  </header>

  <div class="page">
    <main class="content">
      <section class="api-block">
        <div class="terminal-frame api-terminal">
          <span class="api-label">API Сервера:</span>
          <span id="api-output" class="api-output">загрузка...</span>
        </div>
        <p class="version">Версия: 1.21.11+</p>
      </section>

      <section class="description-block">
        <div class="dashed-frame">
          <p id="description-output" class="description-text">загрузка...</p>
        </div>
      </section>

      <section class="events-block">
        <div class="events-frame" id="events-frame">
          <button class="events-toggle" id="events-toggle" aria-expanded="false">
            <span class="events-label">Ивенты</span>
            <span class="toggle-arrow">▾</span>
          </button>
          <div class="events-content" id="events-content">
            <div class="terminal-frame events-terminal">
              <pre id="events-output" class="events-text">загрузка...</pre>
            </div>
          </div>
        </div>
      </section>
    </main>

    <aside class="side-strip">
      <img src="sword.png" alt="" class="sword">
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
