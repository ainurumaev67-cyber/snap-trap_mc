<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Trap</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= БАННЕР ================= -->
  <header class="banner">
    <div class="banner-left">
      <img src="icon.png" alt="Snap Trap" class="banner-icon">
      <h1 class="banner-title">
        <span class="title-snap">Snap</span>
        <span class="title-trap">Trap</span>
      </h1>
    </div>
    <div class="banner-right"></div>
    <div class="banner-fade"></div>
  </header>

  <!-- ================= ОСНОВНАЯ СЕТКА ================= -->
  <div class="page">

    <main class="content">

      <!-- API -->
      <section class="api-block">
        <div class="terminal api-terminal">
          <span class="api-label">API Сервера:</span>
          <span id="api-output" class="api-output clickable" title="Нажмите, чтобы скопировать">загрузка...</span>
        </div>
        <p class="version">
          Версия: 1.21.11+ <span class="badge">Java</span>
        </p>
      </section>

      <!-- ОПИСАНИЕ -->
      <section class="description-block">
        <div class="dashed-frame">
          <p id="description-output" class="description-text">загрузка...</p>
        </div>
      </section>

      <!-- ИВЕНТЫ -->
      <section class="events-block">
        <div class="events-frame" id="events-frame">
          <button class="events-toggle" id="events-toggle" aria-expanded="false" type="button">
            <span class="events-label">Ивенты</span>
            <span class="events-arrow">▾</span>
          </button>
          <div class="events-content" id="events-content">
            <div class="terminal events-terminal">
              <pre id="events-output" class="events-text">загрузка...</pre>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- ПРАВАЯ 20% ПОЛОСА -->
    <aside class="side-strip">
      <div class="side-strip-fade"></div>
      
      <div class="sword-wrapper">
        <img src="sword.png" alt="" class="sword">
        <div class="sword-glint"></div>
      </div>

      <!-- Соцсети и Магазин -->
      <div class="side-links" id="side-links">
        <!-- Кнопка ведет на shop.html -->
        <a href="shop.html" class="side-btn store-btn">Магазин</a>
        <div class="socials-container" id="socials-container">
          <!-- Сюда будут вставляться кнопки соцсетей -->
        </div>
      </div>
    </aside>

  </div>

  <!-- Всплывающее уведомление -->
  <div id="toast" class="toast">Скопировано!</div>

  <script src="script.js"></script>
</body>
</html>
