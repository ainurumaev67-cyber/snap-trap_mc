<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин — Snap Trap</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Дополнительные стили только для страницы магазина */
    .shop-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    .shop-container h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: var(--green);
    }
    .shop-placeholder {
      background: var(--bg-soft);
      border: 3px dashed var(--green);
      padding: 40px;
      border-radius: 8px;
      font-size: 20px;
      color: var(--text-mid);
    }
    .back-link {
      display: inline-block;
      margin-top: 30px;
      color: var(--green);
      text-decoration: none;
      font-size: 18px;
      border-bottom: 1px dashed var(--green);
    }
    .back-link:hover {
      color: var(--green-dark);
    }
  </style>
</head>
<body>

  <!-- ================= БАННЕР ================= -->
  <header class="banner">
    <div class="banner-left">
      <img src="icon.png" alt="Snap Trap" class="banner-icon">
      <h1 class="banner-title">
        <span class="title-snap">Snap</span>
        <span class="title-trap">Trap</span>
      </h1>
    </div>
    <div class="banner-right"></div>
    <div class="banner-fade"></div>
  </header>

  <!-- ================= КОНТЕНТ МАГАЗИНА ================= -->
  <div class="page" style="display: block;">
    <div class="shop-container">
      <h2>Магазин</h2>
      <div class="shop-placeholder">
        Страница находится в разработке.<br>
        Здесь скоро появятся товары и услуги.
      </div>
      <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>
  </div>

</body>
</html>
